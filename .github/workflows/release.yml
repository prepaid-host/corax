name: Release

# A release is published when a commit on main carries a version that has no tag yet,
# which is what merging a release pull request does (tools/release/prepare.sh).
# Run manually to build the packages and the release notes without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(tools/release/check.sh)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet"
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary reports the version of the release
        run: |
          reported=$(target/${{ matrix.target }}/release/corax --version)
          echo "$reported"
          [[ $reported == "corax ${{ needs.version.outputs.version }} "* ]]
      - name: Package
        run: |
          dir=corax-${{ matrix.arch }}-linux
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/corax packaging/omd/corax-omd packaging/checkmk/corax-site-check README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: corax-${{ matrix.arch }}-linux
          path: |
            corax-*.tar.gz
            corax-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          tools/release/check.sh --notes >notes.md
          cat notes.md
          sha256sum --check corax-*.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: needs.version.outputs.release == 'true' && github.event_name == 'push'
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: corax ${{ needs.version.outputs.version }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            corax-*.tar.gz
            corax-*.tar.gz.sha256
